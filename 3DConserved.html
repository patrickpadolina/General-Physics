<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Roller Coaster - Energy Conservation</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #87ceeb;
      color: #fff;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    /* Overlay HUD */
    #hud {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 20px;
      border-radius: 12px;
      backdrop-filter: blur(8px);
      width: 280px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    h2 {
      margin: 0 0 12px 0;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #38bdf8;
    }

    .energy-metric {
      margin-bottom: 12px;
    }

    .label-val {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 4px;
      font-weight: 500;
    }

    .bar-bg {
      width: 100%;
      height: 10px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 5px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 5px;
      transition: width 0.05s linear;
    }

    .pe-bar { background: #3b82f6; } /* Blue for Potential */
    .ke-bar { background: #ef4444; } /* Red for Kinetic */
    .me-bar { background: #22c55e; } /* Green for Total */

    .info-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #94a3b8;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
    }

    #controls {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px 20px;
      border-radius: 30px;
      backdrop-filter: blur(8px);
      display: flex;
      gap: 15px;
    }

    button {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    button:hover {
      background: #7dd3fc;
      transform: translateY(-1px);
    }

    button#run-btn {
      background: #22c55e;
      color: #ffffff;
    }

    button#run-btn:hover {
      background: #4ade80;
    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <!-- Real-time HUD -->
  <div id="hud">
    <h2>Energy Conservation</h2>
    
    <!-- Potential Energy -->
    <div class="energy-metric">
      <div class="label-val">
        <span style="color: #60a5fa;">Potential Energy (PE)</span>
        <span id="pe-val">0 J</span>
      </div>
      <div class="bar-bg">
        <div id="pe-bar" class="bar-fill pe-bar"></div>
      </div>
    </div>

    <!-- Kinetic Energy -->
    <div class="energy-metric">
      <div class="label-val">
        <span style="color: #f87171;">Kinetic Energy (KE)</span>
        <span id="ke-val">0 J</span>
      </div>
      <div class="bar-bg">
        <div id="ke-bar" class="bar-fill ke-bar"></div>
      </div>
    </div>

    <!-- Total Energy -->
    <div class="energy-metric">
      <div class="label-val">
        <span style="color: #4ade80;">Total Mechanical (ME)</span>
        <span id="me-val">0 J</span>
      </div>
      <div class="bar-bg">
        <div id="me-bar" class="bar-fill me-bar" style="width: 100%;"></div>
      </div>
    </div>

    <div class="info-row">
      <span>Height: <strong id="height-val" style="color: #fff;">0</strong> m</span>
      <span>Speed: <strong id="speed-val" style="color: #fff;">0</strong> m/s</span>
    </div>
  </div>

  <!-- Controls Panel -->
  <div id="controls">
    <button id="run-btn">⏸ Pause</button>
    <button id="cam-btn">🎥 Camera: Dynamic</button>
  </div>

  <!-- Include Three.js & OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    // --- Physics Parameters ---
    const MASS = 500; // Cart mass in kg
    const G = 9.81;   // Gravity m/s^2

    // --- Scene Setup ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    
    // Park Sky & Fog
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.FogExp2(0xcce0ff, 0.003);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(40, 35, 60);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI / 2 - 0.01;

    // --- Lighting ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xfff5ea, 1.2);
    sunLight.position.set(80, 100, 50);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.near = 0.5;
    sunLight.shadow.camera.far = 300;
    const d = 100;
    sunLight.shadow.camera.left = -d;
    sunLight.shadow.camera.right = d;
    sunLight.shadow.camera.top = d;
    sunLight.shadow.camera.bottom = -d;
    scene.add(sunLight);

    // Park Grass Floor
    const grassGeometry = new THREE.PlaneGeometry(400, 400);
    const grassMaterial = new THREE.MeshStandardMaterial({ color: 0x4baa3a, roughness: 0.8 });
    const grass = new THREE.Mesh(grassGeometry, grassMaterial);
    grass.rotation.x = -Math.PI / 2;
    grass.receiveShadow = true;
    scene.add(grass);

    // Trees
    function createTree(x, z) {
      const treeGroup = new THREE.Group();
      const trunkGeo = new THREE.CylinderGeometry(0.5, 0.8, 4, 8);
      const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5c4033 });
      const trunk = new THREE.Mesh(trunkGeo, trunkMat);
      trunk.position.y = 2;
      trunk.castShadow = true;
      treeGroup.add(trunk);

      const foliageGeo = new THREE.ConeGeometry(3, 7, 8);
      const foliageMat = new THREE.MeshStandardMaterial({ color: 0x2e8b57, roughness: 0.6 });
      const foliage = new THREE.Mesh(foliageGeo, foliageMat);
      foliage.position.y = 6.5;
      foliage.castShadow = true;
      treeGroup.add(foliage);

      treeGroup.position.set(x, 0, z);
      return treeGroup;
    }

    for (let i = 0; i < 45; i++) {
      const angle = Math.random() * Math.PI * 2;
      const radius = 60 + Math.random() * 80;
      scene.add(createTree(Math.cos(angle) * radius, Math.sin(angle) * radius));
    }

    // --- Track Creation ---
    const points = [
      new THREE.Vector3(-60, 35, 0),    // Starting peak
      new THREE.Vector3(-30, 2, 0),     // First valley
      new THREE.Vector3(-10, 10, 10),   // Loop entry
      new THREE.Vector3(0, 22, 0),      // Top of loop
      new THREE.Vector3(10, 10, -10),   // Loop exit
      new THREE.Vector3(30, 18, 0),     // Small crest
      new THREE.Vector3(50, 2, 0),      // Low stretch
      new THREE.Vector3(20, 5, 25),     // Turn
      new THREE.Vector3(-30, 10, 20),   // Turn back
      new THREE.Vector3(-60, 35, 0)     // Return
    ];

    const curve = new THREE.CatmullRomCurve3(points, true, 'centripetal');
    
    // Coaster Track Mesh
    const trackGeometry = new THREE.TubeGeometry(curve, 300, 0.6, 8, true);
    const trackMaterial = new THREE.MeshStandardMaterial({ color: 0xdd2c00, roughness: 0.3, metalness: 0.6 });
    const trackMesh = new THREE.Mesh(trackGeometry, trackMaterial);
    trackMesh.castShadow = true;
    trackMesh.receiveShadow = true;
    scene.add(trackMesh);

    // Track Pillars
    const numPillars = 40;
    const pillarMat = new THREE.MeshStandardMaterial({ color: 0x9e9e9e, metalness: 0.8 });
    for (let i = 0; i < numPillars; i++) {
      const u = i / numPillars;
      const pt = curve.getPointAt(u);
      if (pt.y > 0.5) {
        const pillarGeo = new THREE.CylinderGeometry(0.3, 0.3, pt.y, 8);
        const pillar = new THREE.Mesh(pillarGeo, pillarMat);
        pillar.position.set(pt.x, pt.y / 2, pt.z);
        pillar.castShadow = true;
        scene.add(pillar);
      }
    }

    // --- Roller Coaster Cart ---
    const cartGroup = new THREE.Group();
    const cartBodyGeo = new THREE.BoxGeometry(2, 1.2, 3);
    const cartMat = new THREE.MeshStandardMaterial({ color: 0xffd700, roughness: 0.2, metalness: 0.8 });
    const cartMesh = new THREE.Mesh(cartBodyGeo, cartMat);
    cartMesh.position.y = 0.8;
    cartMesh.castShadow = true;
    cartGroup.add(cartMesh);

    // Wheels
    const wheelGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.2, 16);
    const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
    const wPositions = [[-1, 0.2, 1], [1, 0.2, 1], [-1, 0.2, -1], [1, 0.2, -1]];
    wPositions.forEach(pos => {
      const wheel = new THREE.Mesh(wheelGeo, wheelMat);
      wheel.rotation.z = Math.PI / 2;
      wheel.position.set(...pos);
      cartGroup.add(wheel);
    });

    scene.add(cartGroup);

    // --- Fixed Physics Setup ---
    let maxHeight = -Infinity;
    let minHeight = Infinity;
    const samples = 200;
    for (let i = 0; i <= samples; i++) {
      const h = curve.getPointAt(i / samples).y;
      if (h > maxHeight) maxHeight = h;
      if (h < minHeight) minHeight = h;
    }

    const heightOffset = Math.max(0, minHeight - 1);
    
    // Add 2000 Joules initial kinetic energy boost (chain lift / push) 
    // so velocity is never zero at the top peak!
    const INITIAL_KE_BOOST = 2000;
    const E_TOTAL = (MASS * G * (maxHeight - heightOffset)) + INITIAL_KE_BOOST;

    // Motion State
    let distance = 0.001; // Start slightly off 0
    let cameraMode = 'orbit';
    let isRunning = true;

    // HUD & Control Handles
    const peValEl = document.getElementById('pe-val');
    const keValEl = document.getElementById('ke-val');
    const meValEl = document.getElementById('me-val');
    const peBarEl = document.getElementById('pe-bar');
    const keBarEl = document.getElementById('ke-bar');
    const heightValEl = document.getElementById('height-val');
    const speedValEl = document.getElementById('speed-val');
    const runBtn = document.getElementById('run-btn');
    const camBtn = document.getElementById('cam-btn');

    runBtn.addEventListener('click', () => {
      isRunning = !isRunning;
      if (isRunning) {
        runBtn.innerText = "⏸ Pause";
        runBtn.style.background = "#22c55e";
      } else {
        runBtn.innerText = "▶ Run";
        runBtn.style.background = "#38bdf8";
      }
    });

    camBtn.addEventListener('click', () => {
      if (cameraMode === 'orbit') {
        cameraMode = 'follow';
        camBtn.innerText = "🎥 Camera: Free Orbit";
      } else {
        cameraMode = 'orbit';
        camBtn.innerText = "🎥 Camera: Dynamic";
        camera.position.set(40, 35, 60);
        controls.target.set(0, 10, 0);
      }
    });

    // --- Animation Loop ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = Math.min(clock.getDelta(), 0.1); // Cap delta to prevent huge jumps

      // 1. Position Cart on Track
      const currentPoint = curve.getPointAt(distance);
      const lookAtPoint = curve.getPointAt((distance + 0.001) % 1);

      cartGroup.position.copy(currentPoint);
      cartGroup.lookAt(lookAtPoint);

      // 2. Physics & Energy Calculation
      const currentHeight = Math.max(0, currentPoint.y - heightOffset);
      let PE = MASS * G * currentHeight;
      PE = Math.min(PE, E_TOTAL);
      
      const KE = Math.max(500, E_TOTAL - PE); // Ensure KE > 0 so cart never stalls
      const velocity = Math.sqrt((2 * KE) / MASS);

      // 3. Increment Motion
      if (isRunning) {
        const trackLength = curve.getLength();
        if (trackLength > 0) {
          distance += (velocity * delta) / trackLength;
          distance %= 1; // Seamless loop
        }
      }

      // 4. Update HUD
      const pePercent = (PE / E_TOTAL) * 100;
      const kePercent = (KE / E_TOTAL) * 100;

      peValEl.innerText = `${Math.round(PE).toLocaleString()} J`;
      keValEl.innerText = `${Math.round(KE).toLocaleString()} J`;
      meValEl.innerText = `${Math.round(E_TOTAL).toLocaleString()} J`;

      peBarEl.style.width = `${pePercent}%`;
      keBarEl.style.width = `${kePercent}%`;

      heightValEl.innerText = currentHeight.toFixed(1);
      speedValEl.innerText = velocity.toFixed(1);

      // 5. Camera Management
      if (cameraMode === 'follow') {
        const camOffset = new THREE.Vector3(0, 5, -12).applyQuaternion(cartGroup.quaternion);
        camera.position.copy(cartGroup.position).add(camOffset);
        camera.lookAt(cartGroup.position.clone().add(new THREE.Vector3(0, 2, 0)));
      } else {
        controls.update();
      }

      renderer.render(scene, camera);
    }

    // Responsive Window Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Start Simulation Loop
    animate();
  </script>
</body>
</html>
